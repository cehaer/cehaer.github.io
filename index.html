<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spidey Tracker - Chr.Ratsya</title>

<!-- Font Pixel Art Retro -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  height: 100vh;
  font-family: 'VT323', monospace;
  color: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background-color: #0d2b45;
  position: relative;
}

/* Background */
.bg-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(circle at center, #1d4ed8 0%, #0f172a 100%);
  z-index: -3;
}

.pixel-map-grid {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-image: 
    linear-gradient(rgba(56, 189, 248, 0.15) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56, 189, 248, 0.15) 1px, transparent 1px);
  background-size: 20px 20px;
  z-index: -2;
}

/* --- OVERLAY INTRO SPIDEY TRACKER --- */
#introOverlay {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: #111827;
  z-index: 999;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  transition: opacity 0.5s ease, visibility 0.5s;
  padding: 20px;
}

/* ANIMASI SPIDER-MAN TURUN & BERGELANTUNG MULUS TANPA JEDA */
.swing-container {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  transform-origin: top center;
  animation: dropAndSwing 4.5s ease-in-out infinite alternate;
}

.web-line {
  width: 3px;
  height: 110px;
  background: #ffffff;
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
}

.hanging-spidey {
  width: 65px;
  height: auto;
  margin-top: -1px;
  filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.6));
}

@keyframes dropAndSwing {
  0% { transform: translateX(-50%) translateY(-350px) rotate(0deg); }
  25% { transform: translateX(-50%) translateY(0px) rotate(-8deg); }
  50% { transform: translateX(-50%) translateY(0px) rotate(8deg); }
  75% { transform: translateX(-50%) translateY(0px) rotate(-8deg); }
  100% { transform: translateX(-50%) translateY(0px) rotate(8deg); }
}

/* Teks Intro & Loading Bar */
.intro-content-box {
  margin-top: 150px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.intro-title {
  font-family: 'Press Start 2P', cursive;
  font-size: 13px;
  color: #ffffff;
  margin-bottom: 12px;
  text-shadow: 2px 2px #000;
  letter-spacing: 1px;
}

.intro-desc {
  font-family: 'Press Start 2P', cursive;
  font-size: 7px;
  line-height: 1.8;
  color: #94a3b8;
  max-width: 280px;
  margin-bottom: 20px;
}

.loading-bar-box {
  width: 180px;
  height: 12px;
  background: #1e293b;
  border: 3px solid #000000;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 25px;
  box-shadow: 3px 3px 0px #000;
}

.loading-bar-fill {
  width: 0%;
  height: 100%;
  background: #ef4444;
  transition: width 0.3s ease;
}

.enter-btn {
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  padding: 12px 20px;
  background: #facc15;
  border: 3px solid #000;
  color: #000;
  cursor: pointer;
  box-shadow: 4px 4px 0px #000;
  display: none;
  animation: pulseBlink 0.8s infinite alternate;
}

.enter-btn:hover {
  background: #ef4444;
  color: #fff;
}

@keyframes pulseBlink {
  0% { opacity: 0.8; transform: scale(0.98); }
  100% { opacity: 1; transform: scale(1.02); }
}

/* --- OVERLAY INITIALIZING MAP (LAYAR LOADING TRANSISI LENGKAP) --- */
#mapLoadingOverlay {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: #182026;
  z-index: 998;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: opacity 0.5s ease, visibility 0.5s;
}

/* TEKS INITIALIZING MAP BERKEDIP SEDIKIT AGAK PELAN */
.initializing-text {
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  color: #7dd3fc;
  letter-spacing: 1px;
  text-shadow: 1px 1px #000;
  animation: slowBlink 1.2s ease-in-out infinite alternate;
}

@keyframes slowBlink {
  0% { opacity: 0.2; }
  100% { opacity: 1; }
}

.map-bottom-bar {
  position: absolute;
  bottom: 25px;
  width: 85%;
  max-width: 320px;
  background: #27272a;
  border: 3px solid #000000;
  border-radius: 6px;
  padding: 10px;
  text-align: center;
  font-family: 'Press Start 2P', cursive;
  font-size: 9px;
  color: #9ca3af;
  box-shadow: inset -2px -2px 0px #18181b, 0px 4px 0px #000;
}

/* --- BANNER GAMBAR SIGHTING.JPG (PRESISI DI TENGAH-TENGAH ATAS) --- */
.floating-sightings-banner {
  position: fixed;
  top: -180px; /* Sembunyi di luar atas layar */
  left: 50%;
  transform: translateX(-50%);
  width: 260px; /* Lebar banner */
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 100;
  opacity: 0;
  transition: top 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
  pointer-events: none;
  filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.6));
}

.floating-sightings-banner img {
  width: 100%;
  height: auto;
  display: block;
  margin: 0 auto;
}

/* Ketika Aktif: Meluncur Turun Tepat di Tengah-Tengah Atas */
.floating-sightings-banner.show-banner {
  top: 20px; /* Posisi di bagian atas layar */
  opacity: 1;
}

/* --- KONTEN UTAMA --- */
.tracker-box {
  position: relative;
  text-align: center;
  background: #0284c7;
  padding: 28px 24px 36px;
  border-radius: 12px;
  width: 330px;
  border: 4px solid #000000;
  box-shadow: 
    inset -4px -4px 0px #0369a1,
    inset 4px 4px 0px #38bdf8,
    8px 8px 0px #000000;
  z-index: 2;
}

.pixel-header {
  background: #ef4444;
  border: 3px solid #000000;
  padding: 8px 12px;
  margin-bottom: 20px;
  box-shadow: inset -2px -2px 0px #991b1b, inset 2px 2px 0px #fca5a5;
}

.pixel-header h1 {
  font-family: 'Press Start 2P', cursive;
  font-size: 13px;
  color: #ffffff;
  text-shadow: 2px 2px #000000;
  letter-spacing: 1px;
}

.hud-status {
  font-family: 'Press Start 2P', cursive;
  font-size: 8px;
  color: #fef08a;
  text-shadow: 1px 1px #000000;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.blink-dot {
  width: 8px; height: 8px;
  background-color: #22c55e;
  border: 1px solid #000000;
  animation: blink 0.8s infinite steps(2);
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

a {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 12px 0;
  padding: 10px 14px;
  background: #facc15;
  border: 3px solid #000000;
  color: #000000;
  text-decoration: none;
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  box-shadow: inset -3px -3px 0px #ca8a04, inset 3px 3px 0px #fef08a, 4px 4px 0px #000000;
  transition: transform 0.1s;
  cursor: pointer;
}

a:hover {
  background: #ef4444;
  color: #ffffff;
  box-shadow: inset -3px -3px 0px #991b1b, inset 3px 3px 0px #fca5a5, 4px 4px 0px #000000;
  transform: translate(-2px, -2px);
}

a:active {
  transform: translate(2px, 2px);
  box-shadow: inset 2px 2px 0px #991b1b, 0px 0px 0px #000000;
}

/* BANNER TEKS */
.ticker-container {
  margin-top: 18px;
  background: #18181b;
  border: 3px solid #000000;
  border-radius: 6px;
  padding: 6px 10px;
  height: 28px;
  overflow: hidden;
  box-shadow: inset 2px 2px 0px #000000;
  display: flex;
  align-items: center;
  position: relative;
}

.ticker-content {
  font-family: 'Press Start 2P', cursive;
  font-size: 8px;
  color: #38bdf8;
  text-shadow: 1px 1px #000000;
  white-space: nowrap;
}

.mode-static {
  text-align: center;
  width: 100%;
}

.mode-scroll {
  position: absolute;
  left: 0;
  animation: scrollFull 9s linear forwards;
}

@keyframes scrollFull {
  0% { transform: translateX(330px); }
  100% { transform: translateX(-100%); }
}

.is-tv-glitch {
  animation: tvFlicker 0.4s ease-in-out;
}

@keyframes tvFlicker {
  0% { opacity: 1; transform: scaleY(1); filter: contrast(100%); }
  15% { opacity: 0.1; transform: scaleY(0.2) skewX(15deg); filter: contrast(200%); }
  30% { opacity: 0.8; transform: scaleY(1.3) skewX(-10deg); color: #ef4444; }
  45% { opacity: 0.0; }
  60% { opacity: 1; transform: scaleY(0.4); color: #facc15; }
  75% { opacity: 0.2; transform: scaleY(1); }
  100% { opacity: 1; transform: scaleY(1) skewX(0deg); color: #38bdf8; }
}

/* GAMBAR LOGO POJOK KIRI BAWAH */
.spider-corner {
  position: fixed;
  bottom: 20px;
  left: 20px;
  width: 90px;
  height: 90px;
  z-index: 10;
  animation: floatSpider 1.2s ease-in-out infinite;
  filter: drop-shadow(0px 0px 10px rgba(239, 68, 68, 0.5));
}

.spider-corner img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 50%;
}

@keyframes floatSpider {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
}
</style>
</head>

<body>

  <!-- BANNER GAMBAR SIGHTING.JPG -->
  <div class="floating-sightings-banner" id="sightingsBanner">
    <img src="sighting.jpg" alt="107 Unexplored Sightings">
  </div>

  <!-- INTRO SCREEN OVERLAY -->
  <div id="introOverlay">

    <!-- SPIDER-MAN GELANTUNG TURUN & BERGELANTUNG MULUS -->
    <div class="swing-container">
      <div class="web-line"></div>
      <img src="spidey.jpg" alt="Spider-Man Hanging" class="hanging-spidey">
    </div>

    <!-- TEKS INTRO & LOADING -->
    <div class="intro-content-box">
      <div class="intro-title">WELCOME TO THE SPIDEY TRACKER.</div>
      <div class="intro-desc">INTERACT WITH THE MAP TO VIEW SPIDER-MAN SIGHTINGS ALL OVER THE WORLD.</div>

      <div class="loading-bar-box" id="loadingBox">
        <div class="loading-bar-fill" id="loadingFill"></div>
      </div>

      <button class="enter-btn" id="enterBtn" onclick="closeIntro()">START TRACKING</button>
    </div>

  </div>

  <!-- OVERLAY LOADING INITIALIZING MAP (LENGKAP) -->
  <div id="mapLoadingOverlay">
    <div class="initializing-text">INITIALIZING MAP...</div>
    <div class="map-bottom-bar">LOADING</div>
  </div>

  <div class="bg-overlay"></div>
  <div class="pixel-map-grid"></div>

  <!-- GAMBAR LOGO SPIDER-MAN DI POJOK KIRI BAWAH -->
  <div class="spider-corner">
    <img src="Spiderman.jpg" alt="Spider-Man Logo">
  </div>

  <div class="tracker-box">
    
    <div class="pixel-header">
      <h1>SPIDEY TRACKER</h1>
    </div>

    <div class="hud-status">
      <div class="blink-dot"></div>
      <span>SIGHTING LOCKED</span>
    </div>

    <a href="https://www.instagram.com/chr.ratsyh?igsh=MXJyZ3BscDlqb2wzcw==" target="_blank" onclick="playBeep()">
      <i class="fa-brands fa-instagram"></i> INSTAGRAM I
    </a>

    <a href="https://www.instagram.com/chr.ratsyah?igsh=MXJtdjhxZm5xMDdmdA==" target="_blank" onclick="playBeep()">
      <i class="fa-brands fa-instagram"></i> INSTAGRAM II
    </a>

    <a href="https://www.tiktok.com/@adtyrtsyh?_r=1&_t=ZS-93AiWYzORef" target="_blank" onclick="playBeep()">
      <i class="fa-brands fa-tiktok"></i> TIKTOK
    </a>

    <div class="ticker-container" id="tickerBox">
      <div class="ticker-content mode-static" id="tickerText">SPIDEY TRACKER</div>
    </div>

  </div>

  <script>
    // --- SETUP AUDIO FILE UNTUK GITHUB ---
    const welcomeAudio = new Audio('welcome.mp3');
    const sightingsAudio = new Audio('sightings.mp3');

    // --- ANIMASI LOADING INTRO AWAL ---
    let progress = 0;
    const fillBar = document.getElementById('loadingFill');
    const loadingBox = document.getElementById('loadingBox');
    const enterBtn = document.getElementById('enterBtn');

    const loadingInterval = setInterval(() => {
      progress += 20;
      fillBar.style.width = progress + '%';

      if (progress >= 100) {
        clearInterval(loadingInterval);
        setTimeout(() => {
          loadingBox.style.display = 'none';
          enterBtn.style.display = 'inline-block';
        }, 300);
      }
    }, 250);

    function closeIntro() {
      // 1. Jalankan suara Beep saat tombol START TRACKING diklik
      playBeep();

      // 2. Tutup overlay intro
      const introOverlay = document.getElementById('introOverlay');
      introOverlay.style.opacity = '0';
      introOverlay.style.visibility = 'hidden';

      // 3. Tampilkan Layar Loading Transition "INITIALIZING MAP..."
      const mapLoadingOverlay = document.getElementById('mapLoadingOverlay');
      mapLoadingOverlay.style.display = 'flex';

      // 4. Jeda sebentar sebelum masuk ke tampilan utama
      setTimeout(() => {
        // Hilangkan layar loading transisi
        mapLoadingOverlay.style.opacity = '0';
        mapLoadingOverlay.style.visibility = 'hidden';

        setTimeout(() => {
          mapLoadingOverlay.style.display = 'none';
        }, 500);

        // Putar audio welcome setelah loading map selesai
        welcomeAudio.play().catch(e => console.log('Audio welcome belum disiapkan:', e));

        // Munculkan banner gambar luar dan jalankan teks running
        showSightingsBanner();
        startTickerCycle();

      }, 2500); // Durasi jeda loading map: 2.5 detik
    }

    // --- LOGIKA POP-UP GAMBAR SIGHTING.JPG ---
    function showSightingsBanner() {
      const banner = document.getElementById('sightingsBanner');

      setTimeout(() => {
        // Meluncur turun & memudar jelas
        banner.classList.add('show-banner');
        
        // Bunyi audio sightings
        sightingsAudio.play().catch(e => console.log('Audio sightings belum disiapkan:', e));

        // Tampil tepat selama 3 detik (3000ms)
        setTimeout(() => {
          banner.classList.remove('show-banner');
        }, 3000);

      }, 300);
    }

    // --- LOGIKA TEXT RUNNING ---
    const tickerText = document.getElementById('tickerText');
    const longText = "SPIDEY TRACKER FROM CHR.RATSYA • SHARE YOUR SPIDEY SIGHTINGS ON X";
    const staticText = "SPIDEY TRACKER";

    function startTickerCycle() {
      tickerText.className = "ticker-content mode-static";
      tickerText.innerText = staticText;

      setTimeout(() => {
        tickerText.classList.add("is-tv-glitch");

        setTimeout(() => {
          tickerText.classList.remove("is-tv-glitch", "mode-static");
          tickerText.className = "ticker-content mode-scroll";
          tickerText.innerText = longText;

          setTimeout(() => {
            tickerText.className = "ticker-content mode-static";
            tickerText.innerText = "";

            setTimeout(() => {
              tickerText.innerText = staticText;
              tickerText.classList.add("is-tv-glitch");

              setTimeout(() => {
                tickerText.classList.remove("is-tv-glitch");
                startTickerCycle();
              }, 400);

            }, 200);

          }, 9000);

        }, 400);

      }, 2000);
    }

    // --- FUNGSI SUARA BEEP KLIK ---
    function playBeep() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'square';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);

      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }
  </script>

</body>
</html>
