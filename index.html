<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chr - Spider-Man Edition</title>

<!-- Font modern superhero -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: 'Poppins', sans-serif;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background-color: #0b0c10;
}

/* Background blur dengan warna tematik Spider-Man */
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  /* Menggunakan gambar Spider-Man online sebagai default */
  background: url("https://images.unsplash.com/photo-1604200213928-ba3cf4fc8436?q=80&w=1000") no-repeat center center;
  background-size: cover;
  filter: blur(8px) brightness(0.4);
  z-index: -1;
}

/* Pola Jaring Laba-laba Overlay */
body::after {
  content: "";
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-image: radial-gradient(rgba(226, 30, 44, 0.2) 1px, transparent 0);
  background-size: 24px 24px;
  z-index: -1;
  pointer-events: none;
}

/* Box utama dengan border glowing khas Spider-Man */
.box {
  text-align: center;
  background: rgba(15, 15, 25, 0.8);
  padding: 32px 36px;
  border-radius: 20px;
  width: 280px;
  backdrop-filter: blur(12px);
  border: 2px solid rgba(226, 30, 44, 0.7);
  box-shadow: 0 0 25px rgba(226, 30, 44, 0.4), inset 0 0 15px rgba(11, 60, 145, 0.4);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.box:hover {
  transform: translateY(-5px);
  box-shadow: 0 0 35px rgba(226, 30, 44, 0.7), inset 0 0 20px rgba(11, 60, 145, 0.6);
}

/* Judul Nama */
h1 {
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  letter-spacing: 2px;
  margin-bottom: 24px;
  font-size: 20px;
  color: #ffffff;
  text-shadow: 0 0 10px #e21e2c, 0 0 20px #e21e2c;
}

/* Tombol bernuansa jaring / Spider-Suit */
a {
  display: block;
  margin: 14px 0;
  padding: 12px;
  border-radius: 12px;
  background: rgba(226, 30, 44, 0.15);
  border: 1px solid rgba(226, 30, 44, 0.5);
  color: white;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.5px;
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  position: relative;
  overflow: hidden;
}

a:hover {
  background: #e21e2c;
  color: #ffffff;
  border-color: #e21e2c;
  box-shadow: 0 0 18px rgba(226, 30, 44, 0.9);
  transform: scale(1.03);
}

a:active {
  transform: scale(0.98);
}
</style>
</head>

<body>
  <div class="box">
    <h1>𝐂𝐡𝐫.𝐑𝐚𝐭𝐬𝐲𝐚🔥</h1>

    <a href="https://www.instagram.com/chr.ratsyh?igsh=MXJyZ3BscDlqb2wzcw==" target="_blank">
      Instagram 1
    </a>

    <a href="https://www.instagram.com/chr.ratsyah?igsh=MXJtdjhxZm5xMDdmdA==" target="_blank">
      Instagram 2
    </a>

    <a href="https://www.tiktok.com/@adtyrtsyh?_r=1&_t=ZS-93AiWYzORef" target="_blank">
      TikTok
    </a>
  </div>
</body>
</html>
